name: Daily rebuild

# Pulls fresh FRED + Shiller data, rebuilds site/data.json behind a set of
# publish checks (mhd/validate.py), runs the tests, records today's gauge
# reading, and publishes site/ to GitHub Pages. If anything fails, nothing is
# published (the live site keeps its last good version) and an issue is opened.
on:
  schedule:
    - cron: "30 11 * * *"     # every day 11:30 UTC (7:30 AM ET in summer, 6:30 AM in winter)
    - cron: "30 22 * * 1-5"   # weekdays 22:30 UTC, after FRED posts the day's market closes
  workflow_dispatch:
    inputs:
      allow_big_move:
        description: "I checked: the gauge's big move since the last refresh is real"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - run: pip install -r requirements-ci.txt

      # Last good downloads, used only if FRED is down or returns bad data.
      - uses: actions/cache@v4
        with:
          path: data/cache
          key: data-cache-${{ github.run_id }}
          restore-keys: data-cache-

      - name: Tests (before touching data)
        run: python -m pytest -q

      - name: Build data.json behind publish checks
        env:
          MHD_MAX_AGE_HOURS: "0"        # always download fresh data
          MHD_META_MAX_AGE_HOURS: "0"   # and fresh source citations
          MHD_ALLOW_BIG_MOVE: ${{ inputs.allow_big_move && '1' || '0' }}
        run: python -W ignore -m mhd.export

      - name: Tests (on the built data)
        run: python -m pytest -q

      - name: Record today's gauge reading
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history/gauge_log.csv
          if ! git diff --cached --quiet; then
            git commit -m "Gauge log $(date -u +%Y-%m-%d) [skip ci]"
            for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
          fi

      - run: cp data/history/gauge_log.csv site/gauge_log.csv

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Keep the rejected build for inspection
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rejected-build
          path: data/rejected.json
          if-no-files-found: ignore

      - name: Open an alert issue
        if: failure() && github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Daily rebuild failed - site not updated"
          body="The $(date -u +%Y-%m-%d) refresh did not publish. The live site still shows the last good data. Details: $RUN_URL"
          num=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number')
          if [ -n "$num" ]; then gh issue comment "$num" --body "$body"; else gh issue create --title "$title" --body "$body"; fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
